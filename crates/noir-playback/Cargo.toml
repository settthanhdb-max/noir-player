[package]
name = "noir-playback"
description = "Playback engine abstraction and libmpv backend for NOIR Player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# Real libmpv backend. Requires native libmpv (libmpv-dev / libmpv-2.dll).
mpv = ["dep:libmpv2", "dep:libmpv2-sys"]

[dependencies]
noir-core = { workspace = true }
noir-settings = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot = { workspace = true }
libmpv2 = { workspace = true, optional = true }
libmpv2-sys = { version = "4.0", optional = true }

[lints]
workspace = true
